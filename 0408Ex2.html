<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>CSS Image Styling Practice</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 40px;
      background: #fff;
    }

    .container {
      display: flex;
      align-items: flex-start;
      justify-content: center;
      gap: 0px;
    }

    .img-left {
      width: 300px;
      height: 300px;
      border-radius: 18px;
      object-fit: cover;
      display: block;
    }

    .img-circle {
      width: 150px;
      height: 150px;
      border-radius: 50%;
      object-fit: cover;
      flex-shrink: 0;
    }

    .img-right {
      width: 300px;
      height: 300px;
      border-radius: 0;
      object-fit: fill;
      display: block;
    }
  </style>
</head>
<body>

  <div class="container">
    <img class="img-left"
         src="https://picsum.photos/seed/eiffel1/500/400"
         alt="Eiffel Tower">

    <img class="img-circle"
         src="https://picsum.photos/seed/fjord/300/300"
         alt="Landscape">

    <img class="img-right"
         src="https://picsum.photos/seed/eiffel1/500/400"
         alt="Eiffel Tower distorted">
  </div>

</body>
</html>
