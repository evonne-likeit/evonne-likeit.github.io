<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UI Spec Implementation</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400&display=swap" rel="stylesheet">
    
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f0f0f0;
            margin: 0;
            font-family: 'Roboto', sans-serif;
        }

        /* 主容器 496px */
        .widget-container {
            width: 496px;
            background-color: #ffffff;
            border: 1px solid #dcdcdc;
            overflow: hidden;
        }

        /* 頂部標題列 35px */
        .header {
            height: 35px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 15px;
            border-bottom: 1px solid #eaeaea;
        }

        .header-title {
            font-size: 13px;
            color: #707070;
        }

        /* 查看資訊按鈕 */
        .spec-button {
            height: 22px;
            border-radius: 8px;
            background-color: #ffffff;
            border: 1px solid #2f2f2f;
            color: #2f2f2f;
            font-size: 13px;
            padding: 0 18px;
            cursor: pointer;
            outline: none;
        }

        /* 內容區間距：左 20px, 右 26px */
        .scroll-area {
            padding: 20px 26px 20px 20px;
            max-height: 400px;
            overflow-y: auto;
        }

        /* --- 圖片區域：實現左右橘色、上下不留 --- */
        .image-wrapper {
            width: 450px;
            height: 240px;
            background-color: #ffdeb3; /* 橘色底 */
            display: flex;
            justify-content: center;   /* 讓圖片水平置中，露出左右橘色 */
            align-items: flex-start;   /* 從頂部開始 */
            overflow: hidden;
            margin-bottom: 10px;
        }

        .image-wrapper img {
            height: 100%;              /* 高度 100% 填滿，確保上下不露出橘色 */
            width: auto;               /* 寬度依比例縮放 */
            display: block;
        }

        /* --- 資訊區域：每一行獨立綠底 --- */
        .info-section {
            display: none;
        }

        .info-section.active {
            display: block;
        }

        .info-row {
            background-color: #b5ffb5; /* 綠色底 */
            color: #2f2f2f;
            font-size: 13px;
            padding: 2px 8px;          /* 文字內距 */
            margin-bottom: 6px;        /* 行與行之間的白色間隙 */
            word-break: break-all;
        }

        .info-row:last-child {
            margin-bottom: 0;
        }

        /* 自訂捲動軸樣式 */
        .scroll-area::-webkit-scrollbar { width: 8px; }
        .scroll-area::-webkit-scrollbar-thumb { background: #ccc; border-radius: 4px; }
    </style>
</head>
<body>

    <div class="widget-container">
        <div class="header">
            <span class="header-title">預覽</span>
            <button id="infoToggleBtn" class="spec-button">查看資訊</button>
        </div>

        <div class="scroll-area">
            <div class="image-wrapper">
                <img src="https://images.unsplash.com/photo-1494548162494-384bba4ab999?fit=crop&w=400&h=240&q=80" alt="Preview">
            </div>

            <div id="fileInfoDetails" class="info-section">
                <div class="info-row">修改日期：2017/10/12</div>
                <div class="info-row">類別：JPG</div>
                <div class="info-row">大小：466.97KB</div>
                <div class="info-row">路徑：\\designcenter.qnap.com.tw\DesignCenter\PM、RD 請進入\WEB\Stations\A_Image2PDF\v2\sample</div>
            </div>
        </div>
    </div>

    <script>
        const toggleBtn = document.getElementById('infoToggleBtn');
        const infoDetails = document.getElementById('fileInfoDetails');

        toggleBtn.addEventListener('click', function() {
            const isActive = infoDetails.classList.toggle('active');
            toggleBtn.textContent = isActive ? '收起資訊' : '查看資訊';
        });
    </script>

</body>
</html>
