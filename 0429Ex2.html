<!DOCTYPE html>
<html>
<head>
  <title>Button Interaction</title>
</head>
<body>

  <!-- 外框 div -->
  <div style="
    font-family: 'Times New Roman', Times, serif;
    border: 1px solid black;
    width: 75px;
    padding: 10px;
    margin-top: 50px;
    margin-left: 50px;
  ">
    <p id="myText">Hello</p>

    <button
      onmouseover="mouseOver()"
      onmouseout="mouseOut()"
      onclick="mouseClick()"
    >
      Button
    </button>
  </div>

  <script>
    var text = document.getElementById("myText");
    var clicked = false;

    function mouseOver() {
      text.style.color = "hotpink";
    }

    function mouseOut() {
  if (!clicked) {       
    text.style.color = "black";
    text.innerText = "Hello";
  }
}

    function mouseClick() {
      clicked = true;
    text.innerText = "Mouse Click";
    text.style.color = "hotpink";
    }

  </script>

</body>
</html>
